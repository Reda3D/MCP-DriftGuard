<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 190" width="840" height="190" role="img" aria-label="Pipeline: baseline and candidate snapshots feed a diff engine that produces facts, a policy engine that produces findings, and reports in Markdown, JSON and SARIF">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="839" height="189" rx="14" fill="#0B1220" stroke="#1E293B" stroke-width="1"/>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="24" y="42" width="128" height="44" rx="8" fill="#111C2E" stroke="#334155" stroke-width="1"/>
    <text x="88" y="69" font-size="12.5" text-anchor="middle" fill="#E2E8F0">baseline.json</text>

    <rect x="24" y="112" width="128" height="44" rx="8" fill="#111C2E" stroke="#334155" stroke-width="1"/>
    <text x="88" y="139" font-size="12.5" text-anchor="middle" fill="#E2E8F0">candidate.json</text>

    <rect x="208" y="74" width="152" height="52" rx="8" fill="#0F1A2E" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="284" y="96" font-size="13" text-anchor="middle" fill="#E2E8F0">Diff engine</text>
    <text x="284" y="113" font-size="10.5" text-anchor="middle" fill="#64748B">facts only</text>

    <rect x="416" y="74" width="152" height="52" rx="8" fill="#0F1A2E" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="492" y="96" font-size="13" text-anchor="middle" fill="#E2E8F0">Policy engine</text>
    <text x="492" y="113" font-size="10.5" text-anchor="middle" fill="#64748B">severity · block</text>

    <rect x="624" y="74" width="192" height="52" rx="8" fill="#111C2E" stroke="#334155" stroke-width="1"/>
    <text x="720" y="96" font-size="13" text-anchor="middle" fill="#E2E8F0">Reports</text>
    <text x="720" y="113" font-size="10.5" text-anchor="middle" fill="#64748B">md · json · sarif</text>
  </g>

  <g stroke="#64748B" stroke-width="1.4" fill="none">
    <path d="M 152 64 L 178 64 L 178 100"/>
    <path d="M 152 134 L 178 134 L 178 100"/>
  </g>

  <g stroke="#64748B" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M 178 100 L 203 100"/>
    <path d="M 360 100 L 411 100"/>
    <path d="M 568 100 L 619 100"/>
  </g>

  <text x="24" y="176" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#475569">The diff never decides what matters. The policy never reads a schema. A model touches neither.</text>
</svg>
